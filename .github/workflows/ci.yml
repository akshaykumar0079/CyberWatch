name: CyberWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pytest
        working-directory: backend
      - run: python -m pytest ml_engine/tests
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cyberwatch-api ./backend
      - run: docker compose config --quiet
      - name: Smoke test API container
        run: |
          docker run -d --name cyberwatch-smoke -p 8000:8000 -e CYBERWATCH_DB_PATH=/tmp/cyberwatch.db cyberwatch-api
          trap 'docker logs cyberwatch-smoke; docker rm -f cyberwatch-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
